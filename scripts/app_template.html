<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151A26">
<title>北京地铁时刻</title>
<style>
/* ================= 设计令牌 ================= */
:root{
  --bg:#F3F4F6;            /* 页面底 */
  --surface:#FFFFFF;        /* 卡片 */
  --surface-2:#F0F2F5;      /* 次级面 */
  --surface-3:#E9ECF1;
  --ink:#161A24;            /* 主文字 */
  --ink-2:#59616F;          /* 次文字 */
  --ink-3:#9AA1AF;          /* 弱文字 */
  --primary:#2850E6;        /* 沉稳蓝 */
  --primary-deep:#1B3BBF;
  --primary-weak:#EAEFFF;
  --danger:#E5484D;
  --line:#E4E7EC;
  --radius-xl:22px;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:9px;
  --shadow-1:0 1px 2px rgba(22,26,36,.04), 0 6px 20px rgba(22,26,36,.05);
  --shadow-2:0 2px 8px rgba(22,26,36,.06), 0 18px 44px rgba(22,26,36,.14);
  --ease:cubic-bezier(.2,0,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;}

/* 视图转场 */
.view{display:none;min-height:100vh;opacity:0;transform:translateY(10px);}
.view.active{display:block;animation:viewIn .28s var(--ease) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 卡片入场 */
.fade-up{animation:fadeUp .4s var(--ease) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;
  padding:10px 12px 8px;background:rgba(243,244,246,.9);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.topbar .title{flex:1;font-size:16px;font-weight:600;text-align:center;margin-right:44px;letter-spacing:.02em;}
.ibtn{
  background:none;border:none;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px;
  transition:background .15s var(--ease);
}
.ibtn:active{background:var(--surface-2);}

/* ================= 首页 ================= */
.clock-card{
  margin:14px 16px 0;border-radius:var(--radius-xl);overflow:hidden;
  background:linear-gradient(160deg,#1A2236 0%,#12161F 100%);
  color:#F4F6FA;box-shadow:var(--shadow-2);
  padding:22px 22px 20px;position:relative;
}
.clock-card::after{
  content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(40,80,230,.2),transparent 70%);
  pointer-events:none;z-index:0;
}
.clock-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9AA6BC;position:relative;z-index:1;}
.clock-date{font-weight:500;}
.clock-type{font-size:12.5px;color:#9FB1D2;font-weight:500;white-space:nowrap;flex:0 0 auto;letter-spacing:.02em;}
.clock-main{display:flex;align-items:baseline;justify-content:center;margin:14px 0 2px;position:relative;z-index:1;}
.clock-time{font-size:52px;font-weight:800;letter-spacing:.5px;}
.clock-sec{font-size:21px;font-weight:600;color:#9AA6BC;margin-left:3px;}
.clock-foot{display:flex;justify-content:center;align-items:center;gap:12px;font-size:12px;color:#7E8AA0;margin-top:10px;position:relative;z-index:1;}
.clock-foot b{color:#E8ECF4;font-weight:600;}
.upd-btn{
  display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:inherit;
  font-size:12px;line-height:inherit;padding:5px 9px;margin:-5px -9px;border-radius:9px;
  cursor:pointer;font-family:inherit;transition:background .15s var(--ease),color .15s var(--ease);
  position:relative;
}
.upd-btn:active{background:rgba(255,255,255,.12);color:#CDD6E6;}
.upd-btn svg{flex:0 0 auto;}
.upd-btn.checking svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.upd-btn .dot{
  position:absolute;top:1px;right:1px;width:7px;height:7px;border-radius:50%;
  background:#E5484D;display:none;
}
.upd-btn.has-update .dot{display:block;}

.home-body{padding:22px 16px 96px;}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px;margin-bottom:12px;gap:12px;}
.sec-head .t{font-size:15px;font-weight:700;letter-spacing:.01em;flex:0 0 auto;}
.sec-head .s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.fav-list{display:flex;flex-direction:column;gap:11px;}
.fav-card{
  background:var(--surface);border-radius:var(--radius-lg);padding:15px 16px 14px;
  box-shadow:var(--shadow-1);cursor:pointer;position:relative;overflow:hidden;
  display:flex;gap:13px;align-items:stretch;
  transition:transform .15s var(--ease),box-shadow .2s var(--ease);
  animation:fadeUp .4s var(--ease) both;
}
.fav-card:active{transform:scale(.985);}
.fav-card .accent{width:4px;border-radius:3px;flex:0 0 auto;align-self:stretch;}
.fav-card .body{flex:1;min-width:0;}
.fav-card .station-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px;}
.fav-card.pressing{background:#FDEEEE;}
.fav-card.pressing .station-name{color:var(--danger);}
/* ===== 收藏编辑态（长按进入：拖动排序 + 点 X 删除）===== */
/* 禁止长按选中文字 / 长按系统菜单（否则会中断手势） */
.fav-card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
@keyframes favJiggle{
  0%{transform:rotate(-.55deg)}
  25%{transform:rotate(.5deg) translateY(-1px)}
  50%{transform:rotate(-.45deg)}
  75%{transform:rotate(.55deg) translateY(1px)}
  100%{transform:rotate(-.55deg)}
}
/* 编辑态：卡片轻微抖动（逐张错开，模拟桌面图标），并露出 X 按钮 */
/* 编辑态下锁定 touch-action：touch-action 只在手势开始时生效，
   若等到长按后再加就晚了（浏览器已判定为滚动并会 pointercancel 中断拖拽）。
   进入编辑态即锁定，之后的每次长按拖拽都从手势起点生效。 */
.fav-list.editing .fav-card{overflow:visible;cursor:grab;touch-action:none;animation:favJiggle .34s var(--ease) infinite;}
.fav-card.dragging{
  animation:none !important;transform:scale(1.035);opacity:.97;z-index:5;cursor:grabbing;
  box-shadow:0 12px 30px rgba(22,26,36,.20),0 2px 8px rgba(22,26,36,.10);
  touch-action:none;   /* 拖拽时禁止页面滚动 */
  /* 关键：基础样式带有 transition:transform .15s，若不关掉，每次 pointermove 都会被 150ms 过渡追着跑，
     手感发飘；换位时的基准点补偿更会「先跳后追」，表现为拖动过程跳一下。 */
  transition:none !important;
}
/* 拖拽进行中：暂停所有卡片的抖动动画。
   一是避免其余卡片的 transform 干扰 getBoundingClientRect 的位置判定，
   二是让 FLIP 换位动画可用（animation 会覆盖内联 transform）。 */
.fav-list.dragging-active .fav-card{animation:none !important;}
.fav-card .fav-del{
  position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:14px;line-height:23px;text-align:center;
  font-weight:700;box-shadow:0 2px 8px rgba(229,72,77,.40);display:none;z-index:6;
}
.fav-list.editing .fav-card .fav-del{display:block;animation:starPop .3s var(--ease) both;}
.fav-done{display:none;margin-left:auto;font-size:13px;font-weight:700;color:var(--primary);background:none;border:none;padding:0;cursor:pointer;}
.fav-done.show{display:inline-block;}
.fav-lines{display:flex;gap:4px;margin-top:6px;align-items:center;}
.fav-line{width:9px;height:9px;border-radius:3px;}
.fav-time{display:flex;align-items:baseline;gap:7px;margin-top:8px;min-width:0;}
.fav-time .t{font-size:16px;font-weight:700;color:var(--primary);flex:0 0 auto;font-variant-numeric:tabular-nums;}
.fav-time .fc{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
/* 右侧大号倒计时块 */
.fav-cd{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  min-width:104px;text-align:right;padding:2px 0 2px 12px;border-left:1px solid var(--line);
}
.fav-cd .k{font-size:11px;color:var(--ink-3);letter-spacing:.08em;}
.fav-cd .v{font-size:23px;font-weight:800;color:var(--primary);margin-top:3px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;}
.fav-cd .v .unit{font-size:12px;font-weight:600;color:var(--ink-2);margin:0 1px;letter-spacing:0;font-variant-numeric:normal;}
.fav-cd .nd{font-size:10px;color:#7B61FF;font-weight:600;margin-top:3px;}
.fav-cd.off .v{color:var(--ink-3);font-size:15px;font-weight:600;}
.fav-hint{font-size:11.5px;color:var(--ink-3);text-align:center;margin-top:14px;letter-spacing:.02em;}
.empty-tip{text-align:center;color:var(--ink-3);padding:52px 24px;line-height:2;}
.empty-tip .glyph{font-size:46px;display:block;margin-bottom:10px;opacity:.85;}

/* 底部主按钮 */
.bottom-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(243,244,246,0),var(--bg) 42%);
}
.main-btn{
  width:100%;height:52px;background:var(--primary);color:#fff;border:none;border-radius:16px;
  font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 6px 18px rgba(40,80,230,.28);
  transition:transform .12s var(--ease),background .15s var(--ease),box-shadow .2s var(--ease);
}
.main-btn:active{transform:scale(.98);background:var(--primary-deep);box-shadow:0 3px 10px rgba(40,80,230,.3);}

/* ================= 选择器 ================= */
.picker-search{padding:6px 16px 10px;position:sticky;top:0;background:rgba(243,244,246,.92);backdrop-filter:blur(14px);z-index:10;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:13px;
  padding:0 13px;height:44px;transition:background .2s var(--ease),box-shadow .2s var(--ease);
}
.search-box:focus-within{background:#fff;box-shadow:0 0 0 2px var(--primary);}
.search-box svg{flex:0 0 auto;color:var(--ink-3);}
.search-box input{
  flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--ink);height:100%;
}
.search-box input::placeholder{color:var(--ink-3);}
.search-clear{background:none;border:none;color:var(--ink-3);font-size:15px;width:28px;height:28px;border-radius:50%;}
.search-clear:active{background:var(--surface-3);}
.line-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none;position:sticky;top:56px;background:rgba(243,244,246,.92);backdrop-filter:blur(14px);z-index:9;}
.line-tabs::-webkit-scrollbar{display:none;}
.line-tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;
  transition:all .18s var(--ease);font-weight:500;
}
.line-tab.active{color:#fff;border-color:transparent;font-weight:600;box-shadow:0 3px 10px rgba(22,26,36,.14);}
.picker-body{padding:2px 16px 110px;}
.line-group{margin-bottom:20px;}
.line-group-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:10px;padding-left:2px;}
.line-dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;}
.station-chip{
  display:inline-flex;align-items:center;background:var(--surface);border-radius:11px;
  padding:10px 14px;margin:0 8px 8px 0;font-size:14.5px;box-shadow:0 1px 2px rgba(22,26,36,.05);
  cursor:pointer;transition:transform .12s var(--ease),background .15s var(--ease);
}
.station-chip:active{transform:scale(.96);background:var(--surface-2);}
.station-chip.faved::after{content:"★";color:#E8A33D;font-size:11.5px;margin-left:5px;}

/* ================= 详情 ================= */
.station-head{padding:16px 20px 4px;}
.station-title{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.01em;}
.station-title .star{
  font-size:25px;color:#C9CFDB;background:none;border:none;padding:6px;cursor:pointer;line-height:1;
  transition:transform .2s var(--spring);margin-left:2px;
}
.station-title .star.on{color:#E8A33D;}
.station-title .star.pop{animation:starPop .35s var(--spring);}
@keyframes starPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.station-sub{color:var(--ink-3);font-size:12.5px;margin:4px 4px 12px;}
.filter-bar{
  display:none;align-items:center;gap:8px;background:var(--primary-weak);color:var(--primary);
  border-radius:var(--radius-md);padding:10px 13px;font-size:13px;margin:0 4px 14px;
}
.filter-bar.show{display:flex;animation:fadeUp .25s var(--ease) both;}
.filter-bar .clr{margin-left:auto;font-weight:600;text-decoration:underline;}
.dir-list{padding:6px 16px 110px;display:flex;flex-direction:column;gap:14px;}
.dir-card{
  background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-1);
  overflow:hidden;animation:fadeUp .4s var(--ease) both;position:relative;
}
.dir-card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
.dir-card-body{padding:15px 17px 17px;}
.dir-head{display:flex;align-items:center;gap:9px;padding:15px 17px 0;}
.line-badge{
  color:#fff;font-size:12.5px;font-weight:700;border-radius:7px;padding:3.5px 9px;letter-spacing:.02em;
}
.dir-name{font-size:14.5px;font-weight:600;color:var(--ink);}
.dir-sub{font-size:12.5px;color:var(--ink-3);padding:6px 17px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.dir-sub .sep{color:#c8cfdb;}
.dir-sub b{color:var(--primary);font-weight:600;}
.dir-star{
  flex:0 0 auto;background:none;border:none;color:#C9CFDB;font-size:19px;width:36px;height:36px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:auto;
  transition:color .15s var(--ease),background .15s var(--ease),transform .2s var(--spring);
}
.dir-star.on{color:#E8A33D;}
.dir-star:active{transform:scale(.85);}
.countdown{text-align:center;padding:16px 0 4px;position:relative;}
.countdown .label{font-size:12px;color:var(--ink-3);letter-spacing:.12em;margin-bottom:7px;}
.countdown .big{font-size:37px;font-weight:800;letter-spacing:.5px;}
.countdown .big .unit{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 3px;letter-spacing:0;}
.countdown .status{font-size:14px;color:var(--danger);font-weight:600;margin-top:6px;}
.countdown .status.warn{color:#D98B22;}
.next-list{margin-top:13px;border-top:1px solid var(--line);padding-top:11px;}
.nl-title{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em;margin-bottom:5px;}
.next-row{display:flex;align-items:center;gap:9px;padding:6px 9px;font-size:14.5px;border-radius:10px;margin:1px -9px;}
.next-row.cur{background:var(--primary-weak);}
.next-row .t{font-weight:700;min-width:50px;}
.next-row .tag{font-size:10.5px;background:var(--primary);color:#fff;border-radius:5px;padding:1.5px 7px;font-weight:600;}
.next-row .tag.next-day{background:#7B61FF;}
.next-row .sub{font-size:12px;color:var(--ink-3);margin-left:auto;}
.show-all{
  width:100%;margin-top:13px;background:var(--surface-2);border:none;color:var(--primary);
  border-radius:11px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .15s var(--ease);
}
.show-all:active{background:var(--surface-3);}
.show-all .chev{transition:transform .25s var(--ease);font-size:11px;}
.show-all.open .chev{transform:rotate(180deg);}
.all-block{margin-top:14px;}
.all-title{font-size:12px;color:var(--ink-3);font-weight:600;margin-bottom:8px;}
.all-grid{display:flex;flex-wrap:wrap;gap:6px;padding:2px;}
.at-chip{
  background:var(--surface-2);border-radius:8px;padding:4.5px 9px;font-size:12.5px;
  color:var(--ink);flex:0 0 auto;
}
.at-chip.nd{background:#F0ECFF;color:#7B61FF;}
.at-chip.cur{background:var(--primary);color:#fff;font-weight:700;}
.at-chip.cur.nd{background:#7B61FF;color:#fff;}
.at-chip i{font-style:normal;font-size:10px;color:#A39AD6;margin-left:2px;}
.at-chip.cur i{color:#dcd2ff;}
.at-chip i.term{color:var(--ink-3);margin-left:3px;font-size:10px;}
.at-chip.cur i.term{color:#dce4f5;}
.cd-term{font-size:13px;color:#C2410C;font-weight:600;margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;}
.cd-term .mk{background:#FFF1E6;color:#C2410C;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;}
.cd-term .mk.ended{background:#F0F2F6;color:var(--ink-3);}
.next-row .tag.mk{background:#FFF1E6;color:#C2410C;margin-left:4px;}
.first-last{display:flex;gap:9px;margin-top:13px;}
.fl-item{flex:1;background:var(--surface-2);border-radius:12px;padding:9px 10px;text-align:center;}
.fl-item .k{font-size:11px;color:var(--ink-3);}
.fl-item .v{font-size:15px;font-weight:700;margin-top:3px;}
.fl-item .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:2px;}
.data-note{color:var(--ink-3);font-size:11px;text-align:center;padding:14px 32px 10px;line-height:1.9;}

/* 返回顶部 */
#backTop{
  position:fixed;right:18px;bottom:96px;z-index:30;background:var(--surface);
  box-shadow:var(--shadow-1);border-radius:50%;width:44px;height:44px;border:none;
  font-size:17px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--ease);cursor:pointer;
}
#backTop:active{transform:scale(.92);}

.clr-all{background:none;border:none;color:var(--danger);font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:8px;transition:background .15s var(--ease);}
.clr-all:active{background:#FDECEC;}

/* ================= 删除确认弹层 ================= */
.mask{
  position:fixed;inset:0;background:rgba(16,19,28,.45);z-index:60;
  opacity:0;transition:opacity .22s var(--ease);pointer-events:none;
}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:0;width:100%;max-width:520px;
  background:var(--surface);border-radius:24px 24px 0 0;z-index:61;padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  transition:transform .3s var(--ease);
  box-shadow:0 -8px 40px rgba(16,19,28,.18);
}
.sheet.show{transform:translateX(-50%) translateY(0);}
.sheet .grip{width:38px;height:4.5px;border-radius:3px;background:var(--surface-3);margin:4px auto 14px;}
.sheet-title{font-size:16px;font-weight:700;text-align:center;margin-bottom:4px;}
.sheet-sub{font-size:13px;color:var(--ink-3);text-align:center;margin-bottom:16px;}
.sheet .sb{height:50px;border:none;border-radius:14px;font-size:15.5px;font-weight:600;width:100%;cursor:pointer;transition:background .15s var(--ease);}
.sheet .sb-del{background:#FDECEC;color:var(--danger);margin-bottom:9px;}
.sheet .sb-del:active{background:#FADADA;}
.sheet .sb.primary{background:var(--primary);color:#fff;}
.sheet .sb.primary:active{background:var(--primary-deep);}
.sheet .sb-cancel{background:var(--surface-2);color:var(--ink);}
.sheet .sb-cancel:active{background:var(--surface-3);}

/* Toast */
#toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-70px);z-index:80;

<script id="metro-data" type="application/json">__DATA__</script>
<script>
"use strict";
/* ================= 数据 ================= */
var DATA_FORMAT = 2;   // 数据格式版本：g 存 delta（前端加载后展开）
/* 展开所有 rec.g 的 delta schedule 为完整时刻数组（幂等，已展开的数字数组跳过） */
function expandDataG(d){
  var sts = d && d.stations;
  if (!sts) return d;
  for (var st in sts){
    var recs = sts[st];
    for (var i=0;i<recs.length;i++){
      var rec = recs[i], g = rec.g;
      if (g) for (var gi=0;gi<g.length;gi++){
        var grp = g[gi];
        if (Array.isArray(grp) && grp.length && typeof grp[0] === "number") continue;  // 已展开，跳过
        g[gi] = expandSchedule(grp);
      }
      // 被跳站：从发车时刻里排除快车经过时刻
      if (rec.xr){
        for (var gi2=0;gi2<rec.xr.length;gi2++){
          var ex = rec.xr[gi2];
          if (ex && ex.length && g && g[gi2]){
            var keep = [], exset = {};
            for (var e=0;e<ex.length;e++) exset[ex[e]] = 1;
            for (var k2=0;k2<g[gi2].length;k2++) if (!exset[g[gi2][k2]]) keep.push(g[gi2][k2]);
            g[gi2] = keep;
          }
        }
      }
      // 区间车终点 / 始发站 / 快车：转成每组的 {时刻: 属性} 映射
      rec._term = rec.xt ? rec.xt.map(grpMap) : null;
      rec._start = rec.xs ? rec.xs.map(grpMap) : null;
      rec._fast = rec.xf ? rec.xf.map(grpMap) : null;
    }
  }
  return d;
}
function grpMap(grp){
  if (!grp) return null;
  var m = {};
  for (var term in grp){ for (var k=0;k<grp[term].length;k++) m[grp[term][k]] = term; }
  return m;
}
function loadBestData(){
  var builtin = null;
  var el = document.getElementById("metro-data");
  try { builtin = JSON.parse(el.textContent); }
  catch(e){}
  if (!builtin) builtin = { meta:{}, lines:{}, stations:{}, initial:{} };
  // 新格式（delta）展开一次；随后释放内嵌数据文本（刷新时 HTML 重新解析会恢复）
  if (builtin.meta && builtin.meta.fmt === DATA_FORMAT) expandDataG(builtin);
  try { el.textContent = ""; } catch(e){}
  // localStorage 中自助更新的新数据优先（格式匹配 + bjSha 与内置不同）
  try {
    var cached = JSON.parse(localStorage.getItem("bjmetro_data") || "null");
    if (cached && cached.meta && cached.meta.fmt === DATA_FORMAT && builtin.meta.bjSha
        && String(cached.meta.bjSha) !== String(builtin.meta.bjSha)){
      expandDataG(cached);
      return cached;
    }
  } catch(e){}
  return builtin;
}
var DATA = loadBestData();
var LINES = DATA.lines || {}, STATIONS = DATA.stations || {}, INITIAL = DATA.initial || {}, META = DATA.meta || {}, LINE_ORDER = DATA.lineOrder || {};

/* ================= 状态 ================= */
var favs = {};
try { favs = JSON.parse(localStorage.getItem("bjmetro_favs") || "{}"); } catch(e){}
var lastStation = localStorage.getItem("bjmetro_last") || "";
var curStation = null, curFilter = null;      // curFilter: {l,d} 或 null
var expandedAll = {}, lastNextIdx = {};
var renderRecs = [];

/* ================= 自助更新：前端解析 GitHub json5 源数据 ================= */
var SRC_FILES = [
  "capital-airport-express.json5","changping-line.json5","daxing-airport-express.json5",
  "fangshan-line.json5","line-s1.json5","line1.json5","line10.json5","line11.json5",
  "line12.json5","line13.json5","line14.json5","line15.json5","line16.json5","line17.json5",
  "line18.json5","line19.json5","line2.json5","line3.json5","line4.json5","line5.json5",
  "line6.json5","line7.json5","line8.json5","line9.json5","xijiao-line.json5",
  "yanfang-line.json5","yizhuang-line.json5","yizhuang-t1-line.json5"
];
var SRC_MIRRORS = [
  "https://gh-proxy.com/https://raw.githubusercontent.com/Mick235711/Beijing-Subway-Tools/main/data/beijing/",
  "https://ghfast.top/https://raw.githubusercontent.com/Mick235711/Beijing-Subway-Tools/main/data/beijing/",
  "https://raw.githubusercontent.com/Mick235711/Beijing-Subway-Tools/main/data/beijing/",
  "https://api.github.com/repos/Mick235711/Beijing-Subway-Tools/contents/data/beijing/"
];
var updating = false, pendingBjSha = "", pendingBjDate = "";

/* 下载源文件：依次尝试镜像链（gh-proxy → ghfast → GitHub raw → GitHub API），单文件独立回退 */
function fetchSource(f, timeoutMs){
  var idx = 0;
  function tryNext(){
    if (idx >= SRC_MIRRORS.length) return Promise.reject(new Error(f + " 所有源均不可用"));
    var url = SRC_MIRRORS[idx];
    var isApi = url.indexOf("api.github.com") >= 0;
    idx++;
    var opts = isApi ? {headers:{"Accept":"application/vnd.github.raw"}} : {};
    var timer = null;
    if (timeoutMs){
      try {
        var ctrl = new AbortController();
        timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, timeoutMs);
        opts.signal = ctrl.signal;
      } catch(e){}
    }
    return fetch(url + f, opts).then(function(r){
      if (timer) clearTimeout(timer);
      if (r.ok) return r.text();
      return tryNext();
    }).catch(function(){
      if (timer) clearTimeout(timer);
      return tryNext();
    });
  }
  return tryNext();
}

/* 轻量 json5 解析：支持行/块注释、未加引号的 key、单引号字符串、尾逗号 */
function parseJSON5(text){
  var out = "", i = 0, inStr = false, strCh = "";
  while (i < text.length){
    var ch = text.charAt(i);
    if (inStr){
      if (ch === "\\"){ out += ch + (text.charAt(i+1)||""); i += 2; continue; }
      out += ch;
      if (ch === strCh) inStr = false;
      i++; continue;
    }
    if (ch === '"' || ch === "'"){ inStr = true; strCh = ch; out += '"'; i++; continue; }
    if (ch === "/" && text.charAt(i+1) === "/"){ while (i < text.length && text.charAt(i) !== "\n") i++; continue; }
    if (ch === "/" && text.charAt(i+1) === "*"){ i += 2; while (i < text.length && !(text.charAt(i) === "*" && text.charAt(i+1) === "/")) i++; i += 2; continue; }
    if (/[A-Za-z_$]/.test(ch)){
      var j = i;
      while (j < text.length && /[\w$]/.test(text.charAt(j))) j++;
      var k = j; while (k < text.length && /\s/.test(text.charAt(k))) k++;
      if (text.charAt(k) === ":"){ out += '"' + text.slice(i, j) + '"'; i = j; continue; }
      out += text.slice(i, j); i = j; continue;
    }
    out += ch; i++;
  }
  out = out.replace(/,\s*([}\]])/g, "$1");
  return JSON.parse(out);
}
function toMin(hhmm){
  var m = /(\d{1,2}):(\d{2})/.exec(String(hhmm));
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function expandDelta(arr){
  var out = [];
  for (var i=0;i<arr.length;i++){
    var item = arr[i];
    if (typeof item === "number") out.push(item);
    else if (Array.isArray(item) && item.length===2 && typeof item[0]==="number" && Array.isArray(item[1])){
      for (var r=0;r<item[0];r++) out = out.concat(expandDelta(item[1]));
    }
  }
  return out;
}
function expandSchedule(schedules){
  var times = [];
  for (var si=0; si<(schedules||[]).length; si++){
    var seg = schedules[si];
    if (!seg || typeof seg !== "object") continue;
    if (Array.isArray(seg.trains)){
      for (var ti=0;ti<seg.trains.length;ti++){
        var m1 = toMin(seg.trains[ti]);
        if (m1 != null) times.push(m1);
      }
    } else if (seg.first_train){
      var cur = toMin(seg.first_train);
      if (cur == null) continue;
      times.push(cur);
      var ds = expandDelta(seg.delta || []);
      for (var di=0;di<ds.length;di++){ cur += ds[di]; times.push(cur); }
    }
  }
  var seen = {}, out = [];
  for (var i=0;i<times.length;i++){
    var v = times[i] < 270 ? times[i]+1440 : times[i];   // 先做凌晨 +1440 映射
    if (!seen[v]){ seen[v] = 1; out.push(v); }
  }
  out.sort(function(a,b){return a-b;});                   // 再排序（与 Python 一致）
  return out;
}
function filterTime(hhmm){
  var m = toMin(hhmm);
  if (m == null) return null;
  return m < 270 ? m+1440 : m;
}
function filterHits(times, f){
  var hits = [];
  if (Array.isArray(f.trains)){
    for (var ti=0;ti<f.trains.length;ti++){
      var m = filterTime(f.trains[ti]);
      if (m != null) hits.push(m);
    }
    return hits;
  }
  var ft = filterTime(f.first_train);
  var step = (f.skip_trains || 0) + 1;
  var cnt = f.count;
  var until = filterTime(f.until);
  var start = 0;
  if (ft != null){
    var idx = times.indexOf(ft);
    if (idx >= 0) start = idx;
    else { for (var s=0;s<times.length;s++){ if (times[s] >= ft){ start = s; break; } if (s === times.length-1) start = times.length; } }
  }
  var i = start;
  while (i < times.length){
    var t = times[i];
    if (until != null && t > until) break;
    hits.push(t);
    if (cnt != null && hits.length >= cnt) break;
    i += step;
  }
  return hits;
}
/* 按 schedule filter 语义标记班次属性（与 Python apply_filters 一致），返回 {term, start, fast, exclude} */
function applyFilters(times, filters, routes, station){
  var term = {}, start = {}, fast = {}, exclude = [], tset = {};
  for (var i=0;i<times.length;i++) tset[times[i]] = 1;
  for (var fi=0; fi<(filters||[]).length; fi++){
    var f = filters[fi];
    if (!f || typeof f !== "object") continue;
    var route = (routes && routes[f.plan]) || {};
    var termName = route.ends_with;
    var startName = route.starts_with;
    var skipList = route.skip;
    var isFast = Array.isArray(skipList) && skipList.length > 0;
    var hits = filterHits(times, f);
    for (var hi=0;hi<hits.length;hi++){
      var t = hits[hi];
      if (!tset[t]) continue;
      if (isFast){
        if (skipList.indexOf(station) >= 0){ exclude.push(t); continue; }   // 被跳站：快车经过不停
        fast[t] = f.plan;
      }
      if (startName) start[t] = startName;
      if (termName) term[t] = termName;
    }
  }
  exclude.sort(function(a,b){return a-b;});
  return {term: term, start: start, fast: fast, exclude: exclude};
}
function invertMap(m){
  var out = {};
  for (var t in m){ (out[m[t]] = out[m[t]] || []).push(parseInt(t,10)); }
  for (var v in out) out[v].sort(function(a,b){return a-b;});
  return Object.keys(out).length ? out : null;
}
function cleanName(name){
  return String(name).replace(/[（(][^）)]*[）)]$/,"").trim();
}
function lineSortKey(name){
  var m = /^(\d+)号线$/.exec(name);
  if (m) return [0, parseInt(m[1],10)];
  var order = {"S1线":1,"昌平线":2,"房山线":3,"燕房线":4,"亦庄线":5,"亦庄T1线":6,"西郊线":7,"首都机场线":8,"大兴机场线":9};
  return [1, order[name] || 99];
}
function lineColorOf(d){
  var c = d && d.color;
  if (typeof c === "string" && c.trim()){
    c = c.trim();
    if (c.charAt(0) !== "#") c = "#" + c;
    return c;
  }
  return "#9AA3B5";
}
function directionMeta(tr, direction, sn, stIdx){
  var routings = tr && tr[direction];
  var isLoop = false, reversed = false;
  if (routings && typeof routings === "object"){
    for (var rn in routings){
      var rlow = String(rn).toLowerCase();
      if (String(rn).indexOf("环")>=0 || rlow.indexOf("loop")>=0 || rlow.indexOf("circle")>=0){ isLoop = true; break; }
    }
    reversed = !!routings.reversed;
  }
  var n = sn.length;
  if (isLoop){
    return { t:"", n: sn[reversed ? (((stIdx-1)%n)+n)%n : (stIdx+1)%n] };
  }
  return { t: reversed ? sn[0] : sn[n-1],
           n: reversed ? (stIdx>0 ? sn[stIdx-1] : "") : (stIdx<n-1 ? sn[stIdx+1] : "") };
}
/* 由 28 个 json5 文本构建完整站点索引（与 Python build_index 逻辑一致） */
function buildDataFromSources(texts, newBjSha, newDate){
  var lines = {}, stations = {}, fastSkip = {};
  for (var fi=0; fi<SRC_FILES.length; fi++){
    var d;
    try { d = parseJSON5(texts[fi]); }
    catch(e){ throw new Error("json5 解析失败: "+SRC_FILES[fi]); }
    if (!d || typeof d !== "object") continue;
    var name = d.name || SRC_FILES[fi];
    lines[name] = lineColorOf(d);
    var snRaw = d.station_names || (d.stations||[]).map(function(s){ return s && s.name; });
    var sn = (snRaw||[]).map(cleanName);
    var dg = d.date_groups || {};
    var tr = d.train_routes || {};
    // 收集快车跳站列表（全局）
    for (var dr in tr){
      var routings = tr[dr];
      if (!routings || typeof routings !== "object") continue;
      for (var rname in routings){
        var r = routings[rname];
        if (r && Array.isArray(r.skip) && r.skip.length) fastSkip[name+"|"+dr+"|"+rname] = r.skip;
      }
    }
    var tt = {};
    for (var tk in (d.timetable||{})) tt[cleanName(tk)] = d.timetable[tk];
    for (var si=0; si<sn.length; si++){
      var st = sn[si];
      if (!tt[st]) continue;
      for (var direction in tt[st]){
        var groups = tt[st][direction];
        if (!groups || typeof groups !== "object") continue;
        var routes = tr && tr[direction];
        var groupTimes = {};   // 展开结果（去重 key）
        var groupRaw = {};     // 原始 delta schedule（存储）
        var groupTerm = {};    // {gname: {时刻: 终点站}} 区间车
        var groupStart = {};   // {gname: {时刻: 始发站}} 始发车
        var groupFast = {};    // {gname: {时刻: 快车名}} 快车
        var groupExcl = {};    // {gname: [排除时刻]} 被跳站快车
        for (var gname in groups){
          var gd = groups[gname];
          if (!gd || typeof gd !== "object") continue;
          var arr = expandSchedule(gd.schedule);
          if (arr && arr.length){
            groupTimes[gname] = arr;
            groupRaw[gname] = gd.schedule;
            var af = applyFilters(arr, gd.filters, routes, st);
            groupTerm[gname] = af.term;
            groupStart[gname] = af.start;
            groupFast[gname] = af.fast;
            groupExcl[gname] = af.exclude;
          }
        }
        if (!Object.keys(groupTimes).length) continue;
        var gnames = Object.keys(groups);
        var uniq = [], idxMap = {}, gl = [], xt = [], xs = [], xf = [], xr = [];
        for (var g2=0; g2<gnames.length; g2++){
          var gn = gnames[g2], key = (groupTimes[gn]||[]).join(",");
          if (!key) continue;
          if (!(key in idxMap)){
            idxMap[key] = uniq.length; uniq.push(groupRaw[gn]); gl.push(gn);
            xt.push(invertMap(groupTerm[gn]));
            xs.push(invertMap(groupStart[gn]));
            xf.push(invertMap(groupFast[gn]));
            xr.push((groupExcl[gn] && groupExcl[gn].length) ? groupExcl[gn] : null);
          }
        }
        if (!uniq.length) continue;
        var dow = "";
        for (var day=1; day<=7; day++){
          var gIdx = 0;
          for (var g3=0; g3<gnames.length; g3++){
            var gd2 = dg[gnames[g3]];
            var wds = gd2 && Array.isArray(gd2.weekday) ? gd2.weekday : [];
            if (wds.indexOf(day) >= 0){ gIdx = idxMap[(groupTimes[gnames[g3]]||[]).join(",")] || 0; break; }
          }
          dow += String(gIdx);
        }
        var dm = directionMeta(tr, direction, sn, si);
        var recs = stations[st] || (stations[st] = []);
        var rec = {l:name, d:direction, t:dm.t, n:dm.n, g:uniq, gl:gl, dow:dow};
        for (var xi=0;xi<xt.length;xi++){ if (xt[xi]){ rec.xt = xt; break; } }
        for (var xj=0;xj<xs.length;xj++){ if (xs[xj]){ rec.xs = xs; break; } }
        for (var xk=0;xk<xf.length;xk++){ if (xf[xk]){ rec.xf = xf; break; } }
        for (var xl=0;xl<xr.length;xl++){ if (xr[xl]){ rec.xr = xr; break; } }
        recs.push(rec);
      }
    }
  }
  var ordered = {};
  Object.keys(lines).sort(function(a,b){
    var ka = lineSortKey(a), kb = lineSortKey(b);
    return (ka[0]-kb[0]) || (ka[1]-kb[1]);
  }).forEach(function(ln){ ordered[ln] = lines[ln]; });
  return {
    meta: {
      version: DATA.meta.version || "3.1",
      fmt: DATA_FORMAT,
      updated: newDate || "",
      commitSha: DATA.meta.commitSha || "",
      bjSha: newBjSha || "",
      lines: Object.keys(ordered).length,
      stations: Object.keys(stations).length,
      source: "Beijing-Subway-Tools (MIT) · 网页自助更新",
      lineAliases: DATA.meta.lineAliases || {},
      fastSkip: fastSkip
    },
    lines: ordered,
    stations: stations,
    initial: DATA.initial || {}   // 拼音索引复用内置（新增站点降级）
  };
}

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function pad2(n){ return (n<10?"0":"")+n; }
function fmtHM(m){ var r=m%1440; return pad2(Math.floor(r/60))+":"+pad2(r%60); }
function fmtHMNextDay(m){ return m>=1440 ? {t:fmtHM(m), nd:true} : {t:fmtHM(m), nd:false}; }
function dayType(d){ var w=d.getDay(); return (w===0||w===6)?"we":"wd"; }
function effType(){
  var n = new Date();
  if (n.getHours()<4 || (n.getHours()===4 && n.getMinutes()<30)){
    var y = new Date(n); y.setDate(y.getDate()-1); return dayType(y);
  }
  return dayType(n);
}
function nowMin(){ var n=new Date(); var m=n.getHours()*60+n.getMinutes(); return m; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* 收藏 key: 全站=站名; 方向="站||线||向" */
function dirKey(st,l,d){ return st+"||"+l+"||"+d; }
function isDirKey(k){ return k.indexOf("||")>=0; }
function splitDirKey(k){ var p=k.split("||"); return {st:p[0],l:p[1],d:p[2]}; }

function nextDateOf(absMin){
  var now=new Date(), raw=absMin%1440;
  var d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),Math.floor(raw/60),raw%60,0,0);
  if (d.getTime() < now.getTime()-60000) d=new Date(d.getTime()+86400000);
  return d;
}
function calcNext(times, base){
  for (var i=0;i<times.length;i++) if (times[i]>base) return {abs:times[i],waitSec:times[i]-base,idx:i};
  /* 末班已过：返回次日首班（idx=-1 标记），供渲染"末班已过·距次日首班"+保留班次列表 */
  if (times.length && base >= times[times.length-1]){
    return {abs:times[0]+1440, waitSec:times[0]+1440-base, idx:-1, last:times[times.length-1]};
  }
  return null;
}
function curGi(rec){
  /* 新数据格式：rec.g = [时刻数组...]（去重后的日期组），rec.dow = 7字符（周一~周日各指 g 的索引）
     按当天星期几选择对应的日期组索引（凌晨 0:00-4:30 归入昨天） */
  var now = new Date();
  if (now.getHours()<4 || (now.getHours()===4 && now.getMinutes()<30)) now = new Date(now.getTime()-86400000);
  var d = now.getDay();                 // 0=周日
  var idx = d===0 ? 6 : d-1;            // 周一=0 ... 周日=6
  var ch = rec.dow ? rec.dow.charAt(idx) : "0";
  return (ch >= "0" && ch <= "9") ? parseInt(ch, 10) : 0;
}
function dirTimes(rec){
  var gi = curGi(rec);
  var arr = (rec.g && rec.g.length > gi) ? rec.g[gi] : (rec.g && rec.g[0]);
  return arr || [];
}
/* 某班次的终点站：区间车返回 xt 终点，否则全程终点 */
function termOf(rec, gi, time){
  var tm = rec._term && rec._term[gi];
  if (tm && tm[time] !== undefined) return tm[time];
  return rec.t;
}
/* 某班次的始发站：始发车返回 xs 始发站，否则 null */
function startOf(rec, gi, time){
  var sm = rec._start && rec._start[gi];
  return sm ? sm[time] : null;
}
/* 某班次的快车名：快车返回 xf 快车名，否则 null */
function fastOf(rec, gi, time){
  var fm = rec._fast && rec._fast[gi];
  return fm ? fm[time] : null;
}
/* 快车跳过的站列表（从 meta.fastSkip 查） */
function fastSkipOf(rec, fastName){
  var fs = META && META.fastSkip;
  return fs ? fs[rec.l+"|"+rec.d+"|"+fastName] : null;
}
/* 某班次的所有标记（快车/始发/区间终点），供各显示位置统一使用 */
function marksOf(rec, gi, time){
  var marks = [];
  var fast = fastOf(rec, gi, time);
  if (fast){
    var skip = fastSkipOf(rec, fast);
    marks.push(skip && skip.length ? ("快车·跳"+skip.length+"站") : "快车");
  }
  var start = startOf(rec, gi, time);
  if (start) marks.push(start+"始发");
  var term = termOf(rec, gi, time);
  if (term && term !== rec.t) marks.push("区间·"+term);
  return marks;
}

/* ================= 网页自助更新（前端下载并解析 GitHub 源数据） ================= */
/* 下载 28 个源文件（镜像链），回调进度 */
function downloadAll(onProgress){
  var done = 0;
  return Promise.all(SRC_FILES.map(function(f){
    return fetchSource(f, 20000).then(function(t){
      done++;
      if (onProgress) onProgress(done, SRC_FILES.length);
      return t;
    });
  }));
}
/* 应用新数据：缓存存 delta 原件（压缩），内存展开后替换全局并重绘 */
function applyData(nd){
  try { localStorage.setItem("bjmetro_data", JSON.stringify(nd)); } catch(e){}   // 存 delta 原件
  expandDataG(nd);   // 内存展开
  DATA = nd;
  LINES = DATA.lines || {}; STATIONS = DATA.stations || {}; INITIAL = DATA.initial || {}; META = DATA.meta || {};
  LINE_ORDER = DATA.lineOrder || {};   // 必须同步：否则更新后站点排序失效（回退成按站名排）
  buildPickerIndex();
  renderHome();
  tickHome();
  pushWidgetSnapshot();                // 时刻表更新 → 刷新小部件快照
  if (curStation && STATIONS[curStation]) renderStation();
}
/* 单个方向组的时刻指纹（兼容 delta 与已展开两种格式） */
function groupFP(g){
  return (g||[]).map(function(grp){
    if (Array.isArray(grp) && grp.length && typeof grp[0] === "number") return grp.join(",");
    return expandSchedule(grp).join(",");
  }).join(";");
}
/* 数据内容指纹（无 API 时判定是否有更新） */
function dataFingerprint(d){
  try {
    var sts = d.stations, parts = [JSON.stringify(d.lines)];
    for (var st in sts){
      var recs = sts[st];
      for (var i=0;i<recs.length;i++){
        var r = recs[i];
        parts.push(st + "|" + r.l + "|" + r.d + "|" + r.t + "|" + r.n + "|" + r.dow + "|" + groupFP(r.g));
      }
    }
    return parts.join("\n");
  } catch(e){ return ""; }
}

function calcFavNext(k){
  var recs = null;
  if (isDirKey(k)){
    var pk = splitDirKey(k), tmp = STATIONS[pk.st]||[];
    for (var j=0;j<tmp.length;j++) if (tmp[j].l===pk.l && tmp[j].d===pk.d){ recs=[tmp[j]]; break; }
  } else recs = STATIONS[k]||[];
  if (!recs || !recs.length) return null;
  var base = nowMin(); if (base<270) base += 1440;
  var best = null;
  for (var i=0;i<recs.length;i++){
    var n = calcNext(dirTimes(recs[i]), base);
    if (n && (!best || n.waitSec < best.n.waitSec)) best = {rec:recs[i], n:n};
  }
  return best;
}
function tickFavNext(){
  var nodes = document.querySelectorAll(".fav-cd");
  for (var i=0;i<nodes.length;i++){
    var el = nodes[i], k = el.getAttribute("data-favkey");
    var info = calcFavNext(k);
    var card = el.parentNode;
    var tEl = card.querySelector(".fav-time .t"), fcEl = card.querySelector(".fav-time .fc");
    if (!info){
      el.className = "fav-cd off";
      el.innerHTML = '<span class="k">今日</span><span class="v">已收班</span>';
      if (tEl) tEl.textContent = "—";
      if (fcEl) fcEl.textContent = "";
      continue;
    }
    var rec = info.rec, n = info.n, hm = fmtHMNextDay(n.abs);
    var gi = curGi(rec);
    /* 末班已过（idx<0）时 n.abs = 次日首班（+1440），标记需查原始时刻 */
    var mt = (n.idx < 0) ? (n.abs - 1440) : n.abs;
    var term = termOf(rec, gi, mt);
    var fast = fastOf(rec, gi, mt);
    var start = startOf(rec, gi, mt);
    var isPartial = term && term !== rec.t;
    var extra = [];   // 快车/始发标记（区间终点在 fc 正文里体现）
    if (fast){
      var skip = fastSkipOf(rec, fast);
      extra.push(skip && skip.length ? ("快车·跳"+skip.length+"站") : "快车");
    }
    if (start) extra.push(start+"始发");
    var diff = Math.max(0, nextDateOf(n.abs) - new Date());
    var totalSec = Math.floor(diff/1000), mm = Math.floor(totalSec/60), ss = totalSec%60;
    var waitTxt;
    if (mm >= 60){
      var hh = Math.floor(mm/60), rm = mm%60;
      waitTxt = hh+'<span class="unit">小时</span>'+(rm>0?rm+'<span class="unit">分</span>':"");
    } else {
      waitTxt = mm>0 ? mm+'<span class="unit">分</span>'+pad2(ss)+'<span class="unit">秒</span>' : ss+'<span class="unit">秒</span>';
    }
    el.className = "fav-cd";
    el.innerHTML = '<span class="k">下一班</span><span class="v">'+waitTxt+'</span>'+(hm.nd?'<span class="nd">次日 '+hm.t+'</span>':"");
    if (tEl) tEl.textContent = hm.t;
    if (fcEl){
      var parts = [];
      if (isDirKey(k)){
        if (isPartial) parts.push("区间·"+term);
      } else {
        parts.push(rec.l+" · "+(isPartial ? term : (rec.t||rec.d)));
      }
      parts = parts.concat(extra);
      fcEl.textContent = parts.join(" · ");
      fcEl.style.color = (extra.length || isPartial) ? "#C2410C" : "";
    }
  }
}
function tickHome(){
  var n = new Date();
  $("homeHM").textContent = pad2(n.getHours())+":"+pad2(n.getMinutes());

var pickerOrder = [];
function buildPickerIndex(){
  pickerOrder = Object.keys(LINES);
  var tabs = $("lineTabs");
  var html = '<span class="line-tab active" data-line="__ALL__" style="border-color:var(--primary);color:var(--primary);">全部</span>';
  for (var i=0;i<pickerOrder.length;i++){
    var ln = pickerOrder[i], c = LINES[ln]||"#9AA1AF";
    html += '<span class="line-tab" data-line="'+esc(ln)+'" style="border-color:'+c+'66;color:'+c+';">'+esc(ln)+'</span>';
  }
  tabs.innerHTML = html;
  renderPicker("");
}
function renderPicker(kw){
  kw = (kw||"").trim();
  var active = document.querySelector(".line-tab.active");
  var activeLine = active ? active.getAttribute("data-line") : "__ALL__";
  var body = $("pickerBody");
  var q = kw.toLowerCase(), qIsAlpha = /^[a-z ]*$/.test(q);
  function match(st){
    if (!q) return true;
    if (st.indexOf(q)>=0) return true;
    if (qIsAlpha){
      var ini = INITIAL[st]||"";
      if (ini.indexOf(q)>=0) return true;
      if (ini.charAt(0)===q.charAt(0) && q.length>1) return true;
    }
    return false;
  }
  var html = "";
  for (var li=0;li<pickerOrder.length;li++){
    var ln = pickerOrder[li];
    if (activeLine!=="__ALL__" && ln!==activeLine) continue;
    var c = LINES[ln]||"#9AA1AF", names = [];
    for (var st in STATIONS){
      var recs = STATIONS[st];
      for (var r=0;r<recs.length;r++) if (recs[r].l===ln){ names.push(st); break; }
    }
    // 按线路内真实站序排序（数据侧已用官方线路图坐标定向：东西走向自西向东，南北走向保持官方顺序）
    // 不在顺序表中的站点（数据差异）排到末尾，并按站名兜底排序
    var order = LINE_ORDER[ln];
    if (order && order.length){
      var idxOf = {};
      for (var oi=0; oi<order.length; oi++) idxOf[order[oi]] = oi;
      names.sort(function(a,b){
        var ia = idxOf[a], ib = idxOf[b];
        if (ia === undefined && ib === undefined) return a < b ? -1 : (a > b ? 1 : 0);
        if (ia === undefined) return 1;
        if (ib === undefined) return -1;
        return ia - ib;
      });
    } else {
      names.sort();
    }
    var chips = "";
    for (var k2=0;k2<names.length;k2++){
      if (!match(names[k2])) continue;
      chips += '<span class="station-chip'+(favs[names[k2]]?" faved":"")+'" data-station="'+esc(names[k2])+'">'+esc(names[k2])+'</span>';
    }
    if (chips) html += '<div class="line-group"><div class="line-group-head"><span class="line-dot" style="background:'+c+'"></span>'+esc(ln)+'</div>'+chips+'</div>';
  }
  body.innerHTML = html || '<div class="empty-tip">没有找到匹配的站点</div>';
}

function renderDirBody(){
  var st = curStation;
  if (!st || !STATIONS[st]) return;
  for (var i=0;i<renderRecs.length;i++){
    var rec = renderRecs[i], times = dirTimes(rec);
    var gi = curGi(rec);
    var base = nowMin(); if (base<270) base += 1440;
    var next = calcNext(times, base);
    var cd = $("cd-"+i), cds = $("cdst-"+i), cdt = $("cdt-"+i);
    if (next){
      var diff = Math.max(0, nextDateOf(next.abs) - new Date());
      var totalSec = Math.floor(diff/1000), totalMin = Math.floor(totalSec/60), ss = totalSec%60;
      if (next.idx < 0){
        /* 末班已过：倒计时显示"X 小时 Y 分"（>60分时），cdt 显示末班已过标记，
           并渲染末班附近班次 + 展开全部按钮（用户可查看完整时刻表） */
        var hh = Math.floor(totalMin/60), mm = totalMin%60;
        cd.innerHTML = hh > 0
          ? hh+'<span class="unit">小时</span>'+(mm>0?mm+'<span class="unit">分</span>':"")
          : (mm>0?mm+'<span class="unit">分</span>':'即将');
        cds.style.display="none";
        var lastHm = fmtHMNextDay(next.last);
        cdt.style.display="block";
        cdt.innerHTML = '<span class="mk ended">末班 '+esc(lastHm.t)+(lastHm.nd?'次日':'')+' 已过</span>';
        if (lastNextIdx[i] === undefined || lastNextIdx[i]!==next.idx){
          renderNextListEnded(rec, times, i, lastHm);
          lastNextIdx[i] = next.idx;
        }
      } else {
        cd.innerHTML = totalMin>0
          ? totalMin+'<span class="unit">分</span>'+ss+'<span class="unit">秒</span>'
          : ss+'<span class="unit">秒</span>';
        cds.style.display="none";
        var marks = marksOf(rec, gi, next.abs);
        if (marks.length){
          cdt.style.display="block";
          cdt.innerHTML = marks.map(function(m){ return '<span class="mk">'+esc(m)+'</span>'; }).join(' · ');
        } else {
          cdt.style.display="none";
        }
        if (lastNextIdx[i] === undefined || lastNextIdx[i]!==next.idx){
          renderNextList(rec, times, next, i);
          lastNextIdx[i] = next.idx;
        }
      }
    } else {

      cdt.style.display="none";
      cds.style.display="block";

      cds.textContent = "今日运营已结束";
      if (lastNextIdx[i]!==undefined){ $("nl-"+i).innerHTML=""; lastNextIdx[i]=undefined; }
    }
  }
}

/* ================= 收藏 ================= */
function saveFavs(){ try{ localStorage.setItem("bjmetro_favs", JSON.stringify(favs)); }catch(e){} }

/* ================= 收藏自定义顺序（拖动排序持久化） ================= */
var FAV_ORDER_KEY = "bjmetro_fav_order";
var favOrder = null;   // null = 尚未自定义过顺序，沿用「按收藏时间倒序」
function loadFavOrder(){
  try {
    var a = JSON.parse(localStorage.getItem(FAV_ORDER_KEY) || "null");
    favOrder = (a && a.length) ? a : null;
  } catch(e){ favOrder = null; }
}
function saveFavOrder(){
  try { localStorage.setItem(FAV_ORDER_KEY, JSON.stringify(favOrder || [])); } catch(e){}
}
/* 按自定义顺序排；不在顺序表里的键（新收藏/老数据）按收藏时间倒序置顶 */
function sortFavKeys(keys){
  if (!favOrder) return keys.slice().sort(function(a,b){ return favs[b]-favs[a]; });
  var idx = {}, i;
  for (i=0;i<favOrder.length;i++) idx[favOrder[i]] = i;
  var inList = [], outList = [];
  for (i=0;i<keys.length;i++){
    if (idx[keys[i]] !== undefined) inList.push(keys[i]);
    else outList.push(keys[i]);
  }
  inList.sort(function(a,b){ return idx[a]-idx[b]; });
  outList.sort(function(a,b){ return favs[b]-favs[a]; });
  return outList.concat(inList);
}
/* 同步编辑态的视觉（列表抖动类 + 完成按钮显隐） */
function syncEditUI(){
  var list = $("favList");
  if (!list) return;
  list.classList.toggle("editing", !!editMode);
  var done = $("btnFavDone");
  if (done) done.classList.toggle("show", !!editMode);
}

/* ================= 桌面小部件数据快照 =================
   安卓桌面小部件由 RemoteViews 渲染，既不能用 WebView，也不适合读 1.1MB 全量时刻表。
   因此在这里把「收藏站点的班次」导出成精简快照，由 App 写入内部存储供小部件读取。
   快照只含静态班次，不含「下一班」——那随时间变化，由小部件本地计算。 */
function buildWidgetSnapshot(){
  try {
    var keys = sortFavKeys(Object.keys(favs)), out = [], i, j, r;
    for (i=0;i<keys.length;i++){
      var k = keys[i], name = k, recs = null;
      if (isDirKey(k)){
        var pk = splitDirKey(k), tmp = STATIONS[pk.st] || [];
        name = pk.st; recs = [];
        for (j=0;j<tmp.length;j++) if (tmp[j].l === pk.l && tmp[j].d === pk.d){ recs = [tmp[j]]; break; }
      } else recs = STATIONS[k] || [];
      if (!recs || !recs.length) continue;
      var items = [];
      for (r=0;r<recs.length;r++){
        var rec = recs[r];
        if (!rec.g || !rec.g.length) continue;
        /* g 是加载时已展开 delta 的完整分钟数组；dow 为周一~周日各指向 g 的索引 */
        items.push({ l: rec.l, c: LINES[rec.l] || "#9AA1AF", t: rec.t || "", dow: rec.dow || "", g: rec.g });
      }
      if (items.length) out.push({ n: name, it: items });
    }
    return JSON.stringify({ v: 1, ts: Date.now(), f: out });
  } catch(e){ return null; }
}
/* 推送给原生：安卓通过 addJavascriptInterface 注入 window.MetroWidget */
function pushWidgetSnapshot(){
  try {
    if (window.MetroWidget && window.MetroWidget.onSnapshot){
      var s = buildWidgetSnapshot();
      if (s) window.MetroWidget.onSnapshot(s);
    }
  } catch(e){}
}

function toggleFav(k){
  if (favs[k]) delete favs[k];
  else favs[k] = Date.now();
  saveFavs();
  if (favOrder){                                  // 删除时同步清理顺序表
    var fi = favOrder.indexOf(k);
    if (fi >= 0){ favOrder.splice(fi, 1); saveFavOrder(); }
  }
  pushWidgetSnapshot();                           // 收藏变了 → 刷新小部件快照
  renderHome();
  if (curStation===k){
    var star=$("stStar"); star.textContent = favs[k]?"★":"☆"; star.classList.toggle("on", !!favs[k]);
    $("btnStar").textContent = favs[k]?"★":"☆";
    $("btnStar").style.color = favs[k] ? "#E8A33D" : "#C9CFDB";
  }
  if (curStation && $("view-station").classList.contains("active")) renderStation();
  renderPicker($("searchInput").value);
}

/* ================= 事件 ================= */
/* 收藏迁移：旧数据源线路名 → 新名（如 "4号线大兴线" → "4号线"） */
function migrateFavs(){
  var alias = META.lineAliases || {};
  var changed = false, nf = {};
  for (var k in favs){
    var nk = k;
    if (isDirKey(k)){
      var p = splitDirKey(k);
      if (alias[p.l]){ p.l = alias[p.l]; nk = dirKey(p.st, p.l, p.d); changed = true; }
    }
    nf[nk] = favs[k];
  }
  if (changed){ favs = nf; saveFavs(); }
}

function init(){
  migrateFavs();
  loadFavOrder();
  buildPickerIndex();
  renderHome();
  tickHome();
  pushWidgetSnapshot();
  autoCheckUpdate();

  $("btnPick").addEventListener("click", function(){ navTo("view-picker", {v:"picker"}); });
  $("btnBackPicker").addEventListener("click", function(){ history.back(); });
  $("btnBackStation").addEventListener("click", function(){ history.back(); });

  // 手机返回键/手势返回：恢复到上一级视图
  window.addEventListener("popstate", function(e){
    // 退出编辑态时我们会主动 history.back()，那次 popstate 不应再切换视图
    if (editSuppressPop){ editSuppressPop = false; return; }
    // 编辑态下按系统返回手势/返回键：先退出编辑态，不切换视图、不退出应用
    if (editMode){ onEditBack(); return; }
    onPopState(e.state || {v:"home"});
  });

  // 搜索
  $("searchInput").addEventListener("input", function(){
    $("searchClear").style.display = this.value ? "block" : "none";
    renderPicker(this.value);
  });
  $("searchClear").addEventListener("click", function(){
    $("searchInput").value = "";
    $("searchClear").style.display = "none";
    renderPicker("");
  });

  // 线路 tab
  $("lineTabs").addEventListener("click", function(e){
    var t = e.target.closest(".line-tab");
    if (!t) return;
    this.querySelectorAll(".line-tab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    var c = t.getAttribute("data-line")==="__ALL__" ? "var(--primary)" : (LINES[t.getAttribute("data-line")]||"#2850E6");
    t.style.background = c; t.style.color = "#fff";
    this.querySelectorAll(".line-tab:not(.active)").forEach(function(x){ x.style.background = ""; x.style.color = ""; });
    renderPicker($("searchInput").value);
  });

  // 选站
  $("pickerBody").addEventListener("click", function(e){
    var t = e.target.closest(".station-chip");
    if (!t) return;
    curStation = t.getAttribute("data-station");
    curFilter = null;
    $("searchInput").value = ""; $("searchClear").style.display = "none";
    localStorage.setItem("bjmetro_last", curStation);
    renderStation();
    navTo("view-station", {v:"station", s:curStation});
  });

  // 收藏列表：点击进入；长按进入编辑态（可拖动排序、点 X 删除）
  var list = $("favList");
  function clearPress(){ clearTimeout(pressTimer); pressTimer = null; pressKey = null; }

  function currentDomOrder(){
    var nodes = list.querySelectorAll(".fav-card"), arr = [];
    for (var i=0;i<nodes.length;i++) arr.push(nodes[i].getAttribute("data-key"));
    return arr;
  }
  /* 把当前 DOM 顺序固化为自定义顺序（顺带剔除已删除的键） */
  function commitOrder(){
    favOrder = currentDomOrder().filter(function(k){ return favs[k] !== undefined; });
    saveFavOrder();
    pushWidgetSnapshot();            // 顺序变了 → 刷新小部件快照（小部件跟随收藏顺序）
  }
  function enterEdit(){
    if (editMode) return;
    editMode = true;
    // 压入一条历史记录：安卓系统返回手势/返回键会触发 history.back()，
    // 从而在 popstate 里先退出编辑态，而不是直接退出应用或跳走
    try {
      history.pushState({v:"home", edit:1}, "", location.href);
      editPushed = true;
    } catch(e){ editPushed = false; }
    syncEditUI();
  }
  function exitEdit(){
    if (!editMode) return;
    editMode = false;
    syncEditUI();
    if (editPushed){                  // 清掉进入编辑态时压入的历史记录，保持返回栈整洁
      editPushed = false;
      editSuppressPop = true;
      try { history.back(); } catch(e){ editSuppressPop = false; }
    }
  }
  /* 系统返回（手势/返回键）触发的 popstate：处于编辑态时优先退出编辑态 */
  function onEditBack(){
    editMode = false;
    editPushed = false;
    syncEditUI();
  }
  /* 长按后"拿起"卡片：接管指针，后续 pointermove 即拖动 */
  function startDrag(card){
    drag = { card: card, id: lastPointerId, startY: lastY, moved: false };
    card.classList.add("dragging");
    list.classList.add("dragging-active");   // 暂停抖动动画，启用 FLIP 换位动画
    try { list.setPointerCapture(drag.id); } catch(err){}
  }
  function endDrag(){
    if (!drag) return;
    var d = drag;
    drag = null;
    d.card.style.transform = "";
    d.card.classList.remove("dragging");
    list.classList.remove("dragging-active");
    try { list.releasePointerCapture(d.id); } catch(err){}
    if (d.moved) commitOrder();
  }
  /* FLIP 换位：先记录其余卡片位置，换位后把它们反向偏移回原位，再过渡归零，
     使相邻卡片是"滑动让位"而不是瞬间跳位。 */
  function flipSwap(refNode){
    var nodes = list.querySelectorAll(".fav-card"), items = [], i;
    for (i=0;i<nodes.length;i++){
      if (nodes[i] === drag.card) continue;
      items.push({ el: nodes[i], top: nodes[i].getBoundingClientRect().top });
    }
    var beforeTop = drag.card.offsetTop;
    list.insertBefore(drag.card, refNode);
    drag.startY += (drag.card.offsetTop - beforeTop);   // 修正基准点，保证跟手不跳
    for (i=0;i<items.length;i++){
      var it = items[i], now = it.el.getBoundingClientRect().top, delta = it.top - now;
      if (!delta) continue;
      it.el.style.transition = "none";
      it.el.style.transform = "translateY(" + delta + "px)";
      void it.el.offsetWidth;                            // 强制回流，确保起点生效
      it.el.style.transition = "transform .18s var(--ease)";
      it.el.style.transform = "";
      // 动画结束后清掉内联 transition，恢复基础样式（否则会一直覆盖 box-shadow 的过渡）
      setTimeout(function(el){ return function(){ el.style.transition = ""; }; }(it.el), 220);
    }
  }

  list.addEventListener("pointerdown", function(e){
    var card = e.target.closest(".fav-card");
    if (!card || e.button > 0) return;
    if (e.target.closest(".fav-del")) return;      // X 按钮不触发长按/拖拽
    var k = card.getAttribute("data-key");
    clearPress();
    lastPointerId = e.pointerId;
    lastY = e.clientY;

    if (editMode){
      // 已在编辑态：按住即可拖动（桌面图标手感），无需再次长按 520ms
      pressFired = true;            // 抑制随后的 click，避免误跳转
      navigator.vibrate && navigator.vibrate(15);
      startDrag(card);
      return;
    }

    pressKey = k;
    pressFired = false;
    pressTimer = setTimeout(function(){
      pressFired = true;
      enterEdit();
      navigator.vibrate && navigator.vibrate(30);
      startDrag(card);
    }, 520);
  });

  /* 拖动位移与换位（clientY 为视口坐标），鼠标与触摸共用 */
  function onDragMove(clientY){
    if (!drag) return;
    var dy = clientY - drag.startY;
    drag.moved = true;
    drag.card.style.transform = "translateY(" + dy + "px) scale(1.035)";

    // 越过相邻卡片中线即交换位置；交换后修正基准点，保证卡片跟手不跳
    var sibs = [], nodes = list.querySelectorAll(".fav-card"), i;
    for (i=0;i<nodes.length;i++) sibs.push(nodes[i]);
    var idx = sibs.indexOf(drag.card);
    var box = drag.card.getBoundingClientRect();
    var center = box.top + box.height / 2;
    for (i=0;i<sibs.length;i++){
      if (i === idx) continue;
      var s = sibs[i], r = s.getBoundingClientRect(), sc = r.top + r.height / 2;
      var swapped = (dy < 0 && i < idx && center < sc) || (dy > 0 && i > idx && center > sc);
      if (swapped){
        flipSwap(i < idx ? s : s.nextSibling);
        drag.card.style.transform = "translateY(" + (clientY - drag.startY) + "px) scale(1.035)";
        break;
      }
    }

    // 靠近屏幕上下边缘自动滚动，便于拖到长列表尽头
    var vh = window.innerHeight || document.documentElement.clientHeight;
    if (clientY < 90) window.scrollBy(0, -12);
    else if (clientY > vh - 90) window.scrollBy(0, 12);
  }

  // 鼠标 / 触控笔：用 pointermove
  list.addEventListener("pointermove", function(e){
    if (!drag){ clearPress(); return; }            // 未进入拖拽时，移动视为滚动 → 取消长按
    if (e.pointerId !== drag.id) return;
    if (e.pointerType === "touch") return;         // 触摸交给 touchmove 处理（见下）
    e.preventDefault();
    onDragMove(e.clientY);
  }, { passive:false });

  // 触摸：必须在 touchmove 阶段 preventDefault。
  // 关键坑：pointermove 里调 preventDefault() 无法阻止页面滚动；浏览器一旦把手势判定为滚动，
  // 就会发出 pointercancel，而 pointercancel 会结束拖拽 —— 表现为「能进编辑态但拖不动」。
  list.addEventListener("touchmove", function(e){
    if (!drag) return;
    e.preventDefault();
    var t = e.touches && e.touches[0];
    if (t) onDragMove(t.clientY);
  }, { passive:false });

  list.addEventListener("pointerup", function(e){
    clearPress();
    if (drag && e.pointerId === drag.id) endDrag();
  });
  list.addEventListener("touchend", function(){ clearPress(); endDrag(); });
  list.addEventListener("touchcancel", function(){ clearPress(); endDrag(); });
  list.addEventListener("pointercancel", function(e){
    clearPress();
    // 触摸时的 pointercancel 多由浏览器接管滚动引起，但 touch 事件仍会继续派发，
    // 因此不在此结束拖拽，交给 touchend / touchcancel 收尾，避免拖拽被过早中断。
    if (e && e.pointerType && e.pointerType !== "touch") endDrag();
  });
  list.addEventListener("pointerleave", function(){ if (!drag) clearPress(); });
  // 屏蔽长按系统菜单，避免打断编辑态
  list.addEventListener("contextmenu", function(e){
    if (editMode || e.target.closest(".fav-card")) e.preventDefault();
  });

  list.addEventListener("click", function(e){
    var del = e.target.closest(".fav-del");
    if (del){                                      // 编辑态：点 X 仍走删除确认抽屉
      e.stopPropagation();
      var dk = del.getAttribute("data-del");
      pendingAction = {type:"one", key:dk};
      var dlabel = isDirKey(dk) ? (function(){ var p=splitDirKey(dk); return p.st+" · "+p.l+" · "+(p.d); })() : dk;
      openSheet("删除收藏？", "「"+dlabel+"」将从收藏中移除", "删除收藏");
      return;
    }
    if (pressFired){ pressFired = false; return; }
    var card = e.target.closest(".fav-card");
    if (!card) return;
    if (editMode) return;                          // 编辑态下点卡片不跳转
    var k = card.getAttribute("data-key");
    if (isDirKey(k)){
      var pk = splitDirKey(k);
      curStation = pk.st; curFilter = {l:pk.l, d:pk.d};
    } else {
      curStation = k; curFilter = null;
    }
    localStorage.setItem("bjmetro_last", curStation);
    $("searchInput").value = ""; $("searchClear").style.display = "none";
    renderStation();
    navTo("view-station", {v:"station", s:curStation, l:curFilter?curFilter.l:null, d:curFilter?curFilter.d:null});
  });

  $("btnFavDone").addEventListener("click", function(){
    if (drag) return;
    if (!favOrder) commitOrder();                  // 首次进入编辑态即固化当前顺序
    exitEdit();
  });

  // 详情：方向收藏 / 展开全部
  $("dirList").addEventListener("click", function(e){
    var btn = e.target.closest(".dir-star");
    if (btn){
      e.stopPropagation();
      toggleFav(btn.getAttribute("data-fav"));
      return;
    }
    var sa = e.target.closest(".show-all");
    if (sa){
      var idx = +sa.getAttribute("data-i");
      expandedAll[idx] = !expandedAll[idx];
      var rec = renderRecs[idx], times = rec ? dirTimes(rec) : [];
      var base = nowMin(); if (base<270) base += 1440;
      var n = calcNext(times, base);
      if (n){
        if (n.idx < 0) renderNextListEnded(rec, times, idx, fmtHMNextDay(n.last));
        else renderNextList(rec, times, n, idx);
      }
      if (expandedAll[idx]) scrollToHighlight(idx);
      return;
    }
  });

  // 展开后自动定位到高亮（下一班）时刻
  function scrollToHighlight(i){
    var cur = $("nl-"+i).querySelector(".at-chip.cur");
    if (!cur) return;
    setTimeout(function(){
      try { cur.scrollIntoView({behavior:"smooth", block:"center"}); }
      catch(e){ cur.scrollIntoView(); }
    }, 80);
  }

  // 顶部全站收藏
  function popStar(){
    var s = $("stStar");
    s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
  }
  $("stStar").addEventListener("click", function(){
    if (curStation){ toggleFav(curStation); popStar(); }
  });
  $("btnStar").addEventListener("click", function(){
    if (curStation){ toggleFav(curStation); popStar(); }
  });

  // 过滤清除
  $("filterClear").addEventListener("click", function(){
    curFilter = null;
    renderStation();
  });

  // 删除弹层
  $("sheetMask").addEventListener("click", closeSheet);
  $("sheetCancel").addEventListener("click", closeSheet);
  $("sheetDel").addEventListener("click", onSheetDel);

  // 手动检查更新：点击"数据更新"→ 确认框 → 对比 GitHub
  $("updBtn").addEventListener("click", function(){
    if (checking) return;
    openSheet("检查数据更新", "将连接 GitHub 检查时刻表是否有新版本，仅在发现新数据时提示，不消耗流量下载数据。", "检查更新", "update");
  });

  // 清空全部收藏
  $("btnClearAll").addEventListener("click", function(){
    var n = Object.keys(favs).length;
    if (!n) return;
    pendingAction = {type:"all"};
    openSheet("清空全部收藏？", n+" 个收藏将被全部移除，此操作不可恢复", "全部清空");
  });

  // 返回顶部
  var bt = $("backTop");
  window.addEventListener("scroll", function(){
    bt.style.display = window.scrollY>600 ? "flex" : "none";
  });
  bt.addEventListener("click", function(){ window.scrollTo({top:0,behavior:"smooth"}); });

  // 数据说明
  $("dataNote").textContent = "数据来源：beijing-subway-schedule（CC BY-SA 4.0）· 更新于 "+(META.updated||"—")
    +" · 时刻为计划时间，实际以现场为准";

  // 每秒刷新
  setInterval(function(){
    tickHome();
    tickFavNext();
    if (curStation) renderDirBody();
  }, 1000);

  // 默认打开首页；仅当 URL 带 ?s=站名 参数时直达该站详情（分享/调试用）
  var qs = null;
  try { qs = new URLSearchParams(location.search).get("s"); } catch(e){}
  if (qs && STATIONS[qs]){
    curStation = qs;
    renderStation();
    showView("view-station");
    try { history.replaceState({v:"station", s:qs}, ""); } catch(e){}
  } else {
    try { history.replaceState({v:"home"}, ""); } catch(e){}
  }
}
init();
</script>
</body>
